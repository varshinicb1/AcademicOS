name: Deploy to GCP (Cloud Run + Firebase Hosting)

# Fully automated production deploys. Once the one-time IAM bootstrap
# (deploy/gcp/bootstrap.sh) has been run by the GCP account owner, nothing
# else is ever required from them -- every push to master ships itself.
#
# Auth is keyless via Workload Identity Federation: GitHub's OIDC token is
# exchanged for short-lived GCP credentials scoped to this repo, so there is
# no service-account JSON key to store, leak, or rotate. `id-token: write`
# below is what enables that exchange -- removing it breaks the deploy.
#
#   test          -> real pytest suite (the gate that repeatedly caught regressions)
#   frontend-test -> flutter analyze + flutter test (the same gate for the app)
#   backend       -> Cloud Build -> Artifact Registry -> Cloud Run
#   frontend      -> Flutter web build -> Firebase Hosting (needs backend's URL)
#
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, DEPLOY_SA, RUNTIME_SA,
#   GCP_SERVICE, AR_IMAGE, GCS_MEDIA_BUCKET, SQL_CONNECTION, CORS_ORIGINS
#   CORS_ORIGINS is the Firebase Hosting origins, comma-separated:
#                      https://<project>.web.app,https://<project>.firebaseapp.com
#                      ('*' or http:// origins stop the service starting).
#   GCS_TEST_BUCKET -- a scratch bucket DEPLOY_SA can write to
#                      (vidyuthlabs-academicos-ci-test). The real-GCS
#                      integration test runs against it before every deploy;
#                      with it unset the backend job FAILS (see below).
# Optional:
#   ALLOW_UNVERIFIED_GCS -- 'true' deploys without GCS_TEST_BUCKET, with a
#                      warning. An explicit, visible override for an
#                      emergency, never the default.
#   LLM_BASE_URL / LLM_MODEL -- the school's chosen LLM provider for the
#                      doubt critic (ACOS_LLM_BASE_URL / ACOS_LLM_MODEL). Must
#                      be a host in docs/compliance.md's LLM provider table
#                      when an LLM key is set, or the service refuses to start.
#   FRESH_INSTALL   -- '1' only for a brand-new school with no Supabase history
#                      (lets an empty curriculum snapshot / learner_models boot;
#                      see the deploy step). Remove it after the first deploy.
# No repo *secrets* are needed -- app secrets live in Secret Manager.
#
# Prior to provisioning, this workflow is a no-op: the `test` and
# `frontend-test` jobs still run (they are the project's gates), but `backend`
# skips and `frontend` follows it, so the run is green rather than red. See the
# condition on the `backend` job.
# Run docs/gcp-bootstrap.sh, set the variables above, and it becomes live.

on:
  push:
    branches: [master]
    # Only run when something the GCP release actually ships has changed.
    # Without this, a docs-only or README-only push starts the whole pipeline
    # -- and, until the release is provisioned, fails it. A CI system that goes
    # red for changes it cannot possibly be affected by is one people learn to
    # ignore, which is worse than having no CI.
    paths:
      - 'pyproject.toml'
      - 'config/**'
      - 'src/academicos/**'
      # The suite IS the deploy gate, so a change to it must be able to
      # re-run the gate. A test-only fix for a red run triggered nothing:
      # master carried the fix and the last run anyone could see was the
      # failure it fixed (2026-09-23).
      - 'tests/**'
      - 'academicos-data/syllabus/**'
      - 'frontend/**'
      - 'design/**'
      - 'scripts/**'
      - 'deploy/gcp/**'
      - 'firebase.json'
      - 'contract/**'
      - '.github/workflows/deploy-gcp.yml'
  workflow_dispatch: {}

# Never let two deploys race for the same Cloud Run service.
concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.GCP_SERVICE }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL server, not a mock: the Cloud SQL adapter tests
    # (tests/test_postgres_kv.py, tests/test_migrate_supabase_to_cloudsql.py)
    # assert on genuine SQL semantics -- upsert conflict resolution, integer
    # vs text ordering, JSONB round-trips, and a >1000-row migration that
    # would silently truncate against PostgREST's row cap. Mocking any of
    # that would test nothing. Without this service those tests skip and a
    # broken adapter would reach production with a green suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academicos_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACOS_TEST_PG_HOST: localhost
      ACOS_TEST_PG_PORT: '5432'
      ACOS_TEST_PG_DB: academicos_verify
      ACOS_TEST_PG_USER: postgres
      ACOS_TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # The extras the suite needs, not every extra. `parse-vlm` (torch, transformers)
      # and `retrieval` (sentence-transformers, which pulls torch too) are several GB
      # of CUDA wheels, and installing them filled the runner's disk (`OSError: [Errno
      # 28] No space left on device`, run 37102901738), so the gate failed before a
      # single test ran. No test imports either: the rerank tests stub
      # `sentence_transformers` out to check the fallback, the embedding tagger loads
      # its model lazily, and the VLM parser is never imported by the suite. The
      # production image installs what it needs in the Dockerfile, not here.
      #
      # `postgres` stays, which the Dockerfile installs: without it the Cloud SQL
      # adapter tests below do not skip (the service and ACOS_TEST_PG_* are set),
      # they error on a missing psycopg import.
      - name: Install academicos with the extras the suite uses
        run: pip install -e ".[dev,api,ocr,mobile-scan,gcs,postgres,mcp]"

      - name: Run the real test suite
        run: pytest tests/ -q

  # The app's half of the gate. Until 2026-09-23 no workflow in this repo ran
  # `flutter analyze` or `flutter test` at all: the Python suite gated every
  # deploy while the Flutter app was only ever BUILT, and a build says nothing
  # about whether the app still behaves. That is how the analyzer sat at 61
  # issues across three audits unnoticed, and how the repo's own guard against
  # an error a teacher never sees (test/no_swallowed_errors_test.dart) was
  # failing at the very commit that was live.
  #
  # Its own job rather than a step of `frontend`: that job needs `backend`,
  # which skips while GCP_PROJECT_ID is unset, and a gate that skips with the
  # deploy is not a gate. `frontend` needs this one, so a red app suite stops
  # the deploy as surely as a red pytest run does.
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the local gates run (HANDOVER.md section 3).
          # Unpinned, CI took the newest stable (3.47.5 on 2026-09-28), whose
          # analyzer raised a warning 3.44.9 does not, failed frontend-test
          # and skipped the Hosting deploy of e0d7d63. Bump it here and on
          # the development machines together, in one PR.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend

      # Errors and warnings fail the job (flutter analyze's own default);
      # info-level lints do not. That is the line scorecard item 8.2 draws,
      # and the line Task 803 cleared the analyzer to: removing some of the
      # remaining infos would change behaviour, and a gate that demands it
      # would be pressure to change behaviour to quieten a linter.
      - name: Analyze the Flutter app
        run: flutter analyze --no-fatal-infos
        working-directory: frontend

      # --exclude-tags live-backend: three tests need a server that is not
      # running here (frontend/dart_test.yaml names them and says how to run
      # them). Everything else is a fixture or an in-process fake and must
      # pass from a clean checkout.
      - name: Run the Flutter test suite
        run: flutter test --exclude-tags live-backend
        working-directory: frontend

  backend:
    needs: test
    # Two distinct states, handled differently on purpose:
    #
    #   * Not provisioned at all (no GCP_PROJECT_ID) -- the bootstrap has not
    #     been run yet. There is no release to deploy and nothing is broken, so
    #     the job SKIPS rather than fails. Failing here would paint master red
    #     for a legitimate state and train everyone to ignore the signal.
    #
    #   * Provisioned but incomplete (GCP_PROJECT_ID set, some other variable
    #     missing) -- a real misconfiguration. This condition passes and the
    #     "Check required repository variables" step below fails loudly, naming
    #     every variable that is absent.
    #
    # So: green-skip when there is nothing to do, hard-fail when there is.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      # Fail on a missing variable with a message naming it, rather than
      # letting gcloud fail later with "--service-account: expected one
      # argument" or, worse, silently deploying with an empty CORS origin.
      - name: Check required repository variables are set
        env:
          AR_IMAGE: ${{ vars.AR_IMAGE }}
          GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
          SQL_CONNECTION: ${{ vars.SQL_CONNECTION }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
        run: |
          missing=""
          for name in PROJECT_ID REGION SERVICE WIF_PROVIDER DEPLOY_SA \
                      RUNTIME_SA AR_IMAGE GCS_MEDIA_BUCKET SQL_CONNECTION CORS_ORIGINS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions -> Variables."
            echo "docs/gcp-bootstrap.md lists the exact 'gh variable set' commands."
            exit 1
          fi
          echo "All required repository variables are present."

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # storage/blobs.py's single-writer guarantee rests on GCS behaviour
      # (object generations after upload, 412 on a stale if_generation_match,
      # md5 format, get_blob + pinned download) that the unit suite checks only
      # against an in-memory fake written to the same assumptions. This runs
      # tests/test_gcs_blob_integration.py against the real service with the
      # deploy's own credentials. A skipped test counts as a failure here: a
      # skip is exactly how "never actually verified" looks green. So does a
      # run in which nothing passed.
      #
      # With GCS_TEST_BUCKET unset the job fails before anything is built.
      # It used to emit a ::warning:: and deploy anyway, so a school service
      # could ship on storage semantics that had never run against GCS.
      # ALLOW_UNVERIFIED_GCS=true is the only way past, and it says so.
      # tests/test_deploy_gcp_workflow.py evaluates these `if:` conditions.
      - uses: actions/setup-python@v5
        if: vars.GCS_TEST_BUCKET != ''
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify GCS semantics against a real scratch bucket
        if: vars.GCS_TEST_BUCKET != ''
        env:
          ACOS_GCS_TEST_BUCKET: ${{ vars.GCS_TEST_BUCKET }}
        run: |
          set -o pipefail
          pip install -q -e ".[dev,gcs]"
          python -m pytest tests/test_gcs_blob_integration.py -v -rs 2>&1 | tee gcs-it.log
          if grep -q "SKIPPED" gcs-it.log; then
            echo "::error::GCS integration test skipped -- it must run, not skip"
            exit 1
          fi
          if ! grep -Eq "[0-9]+ passed" gcs-it.log; then
            echo "::error::no GCS integration test passed -- nothing was verified"
            exit 1
          fi

      - name: Block a deploy whose GCS semantics were never verified
        if: vars.GCS_TEST_BUCKET == '' && vars.ALLOW_UNVERIFIED_GCS != 'true'
        run: |
          echo "::error::GCS_TEST_BUCKET is not set, so the curriculum snapshot's generation/412/md5 handling would ship without ever having run against real GCS. Set the GCS_TEST_BUCKET repository variable to a scratch bucket DEPLOY_SA can write to (vidyuthlabs-academicos-ci-test), or set ALLOW_UNVERIFIED_GCS=true to deploy anyway (docs/gcp-deployment.md section 8)."
          exit 1

      - name: Deploy with unverified GCS semantics (ALLOW_UNVERIFIED_GCS=true)
        if: vars.GCS_TEST_BUCKET == '' && vars.ALLOW_UNVERIFIED_GCS == 'true'
        run: |
          echo "::warning::ALLOW_UNVERIFIED_GCS=true: deploying although the GCS integration test did not run (GCS_TEST_BUCKET unset). Remove the override once GCS_TEST_BUCKET is set."

      - name: Build + push image (Cloud Build, layer-cached)
        env:
          AR_IMAGE: ${{ vars.AR_IMAGE }}
        run: |
          # _COMMIT_SHA/_BUILT_AT become the image's build identity, served
          # by GET /health and checked after the deploy (see below).
          gcloud builds submit \
            --project "$PROJECT_ID" \
            --config deploy/gcp/cloudbuild.yaml \
            --substitutions=_IMAGE="${AR_IMAGE}",_COMMIT_SHA=${GITHUB_SHA},_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Deploy to Cloud Run
        id: deploy
        env:
          AR_IMAGE: ${{ vars.AR_IMAGE }}
          GCS_MEDIA_BUCKET: ${{ vars.GCS_MEDIA_BUCKET }}
          SQL_CONNECTION: ${{ vars.SQL_CONNECTION }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          FRESH_INSTALL: ${{ vars.FRESH_INSTALL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          # Every data-access backing service reaches the app through these.
          # Secrets come from Secret Manager, never from the repo.
          #
          # No Supabase secrets, on purpose: on GCP every byte of school data
          # lives in GCP -- the JSONB stores in Cloud SQL (ACOS_POSTGRES_*),
          # scan media and the curriculum snapshot in GCS (ACOS_GCS_BUCKET,
          # storage/blobs.py). With the Supabase URL present the service would
          # quietly keep writing to it wherever GCP was not wired.
          # The last store that still read the Supabase secrets itself,
          # KnowledgeStore (student mastery history), now goes through
          # durable_table("learner_models") -> Cloud SQL. Before the FIRST
          # deploy without them, copy its existing rows:
          #   scripts/migrate_supabase_to_cloudsql.py --only learner_models
          # (docs/gcp-deployment.md section 8). Forgetting is no longer
          # silent: an empty Cloud SQL learner_models answers 503 (see below).
          # --set-secrets replaces the service's whole secret list, so dropping
          # them here also removes them from a service deployed with them.
          SECRETS="ACOS_PRINCIPAL_BOOTSTRAP_KEY=principal-bootstrap-key:latest"
          SECRETS="$SECRETS,ACOS_POSTGRES_PASSWORD=postgres-password:latest"
          # ONE secret, both key names. assessment/vision.py (scan OCR) and
          # assessment/llm_evaluate.py (AI marking) read SARVAM_API_KEY; the
          # doubt critic reads ACOS_LLM_API_KEY. Only the latter used to be
          # injected, so on GCP every scanned page OCR'd as blank. Leaving
          # the secret at bootstrap's REPLACE_ME means "no AI features": they
          # answer 501 "not enabled for this school".
          SECRETS="$SECRETS,ACOS_LLM_API_KEY=acos-llm-api-key:latest"
          SECRETS="$SECRETS,SARVAM_API_KEY=acos-llm-api-key:latest"

          # Everything the operator stored through deploy/gcp/secrets-page.html: each setting
          # in deploy/gcp/optional-config.json whose secret exists in Secret Manager is wired
          # in under its variable name. --set-secrets replaces the whole list, so without this
          # loop the next deploy would silently drop a key set by hand. A secret that does not
          # exist yet is skipped, so a deploy never fails for a channel nobody configured.
          while read -r ENV_NAME SECRET_ID; do
            if gcloud secrets describe "$SECRET_ID" --project "$PROJECT_ID" >/dev/null 2>&1; then
              SECRETS="$SECRETS,${ENV_NAME}=${SECRET_ID}:latest"
              echo "wired optional setting $ENV_NAME"
            fi
          done < <(jq -r '.groups[].items[] | select((.preWired // false) | not) | "\(.env) \(.secret)"' deploy/gcp/optional-config.json)

          # ACOS_ENV=production arms the startup guard (config.py
          # production_config_problems): placeholder/empty secrets, CORS '*',
          # demo accounts, a short bootstrap key, or an LLM URL outside
          # docs/compliance.md's provider table stop the revision starting.
          # "@" separates the vars ("^@^" tells gcloud): ACOS_CORS_ORIGINS is a
          # comma-separated list, and the default "," split it into a bad dict entry.
          ENV_VARS="ACOS_ENV=production"
          ENV_VARS="$ENV_VARS@ACOS_POSTGRES_HOST=/cloudsql/${SQL_CONNECTION}"
          ENV_VARS="$ENV_VARS@ACOS_POSTGRES_DB=academicos"
          ENV_VARS="$ENV_VARS@ACOS_POSTGRES_USER=academicos"
          ENV_VARS="$ENV_VARS@ACOS_GCS_BUCKET=${GCS_MEDIA_BUCKET}"
          ENV_VARS="$ENV_VARS@ACOS_CORS_ORIGINS=${CORS_ORIGINS}"

          # The LLM provider is explicit, never inherited from
          # config/config.toml (whose llm_base_url is api.groq.com, a vendor
          # no document lists). Unset means config.toml's value, which the
          # startup guard refuses once a key is set. The provider is the
          # school's decision; docs/gcp-deployment.md section 4.
          if [ -n "${LLM_BASE_URL}" ]; then
            ENV_VARS="$ENV_VARS@ACOS_LLM_BASE_URL=${LLM_BASE_URL}"
          fi
          if [ -n "${LLM_MODEL}" ]; then
            ENV_VARS="$ENV_VARS@ACOS_LLM_MODEL=${LLM_MODEL}"
          fi

          # An empty curriculum snapshot in GCS, or an empty learner_models in
          # Cloud SQL, is what a service migrated off Supabase sees before the
          # copy scripts run -- so the app refuses both (503 / failed boot)
          # rather than serving blank data as if it were the school's. Before
          # the first deploy of a MIGRATED school run:
          #   scripts/migrate_supabase_to_cloudsql.py            (incl. learner_models)
          #   scripts/migrate_supabase_blobs_to_gcs.py           (snapshot + scan media)
          # For a NEW school with nothing to migrate, set the FRESH_INSTALL
          # repo variable to 1 for the first deploy, then delete it:
          # --set-env-vars replaces the whole list, so the next deploy drops it.
          if [ "${FRESH_INSTALL}" = "1" ]; then
            echo "::warning::FRESH_INSTALL=1: empty curriculum / mastery history allowed. Remove the variable after this deploy."
            ENV_VARS="$ENV_VARS@ACOS_CURRICULUM_ALLOW_EMPTY_BOOT=1"
            ENV_VARS="$ENV_VARS@ACOS_LEARNER_MODELS_ALLOW_EMPTY=1"
          fi

          # --max-instances=1 is a correctness limit, not a cost one.
          # CurriculumStore keeps its 18 FK-linked tables in a local SQLite
          # file and persists it as ONE GCS object (the snapshot). Two
          # instances would each hold their own copy and each upload would
          # replace the other's wholesale: lost calendar/sequence edits.
          # storage/blobs.py also refuses a stale overwrite (GCS generation
          # precondition), but that only turns silent loss into a logged
          # refusal; one instance is what prevents it. Lift this when
          # CurriculumStore moves to Cloud SQL like the JSONB stores.

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${AR_IMAGE}:${GITHUB_SHA}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 --memory=1Gi \
            --concurrency=40 \
            --timeout=300 \
            --min-instances=1 \
            --max-instances=1 \
            --cpu-boost \
            --add-cloudsql-instances "${SQL_CONNECTION}" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "$SECRETS" \
            --set-env-vars "^@^$ENV_VARS" \
            --quiet

          URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      # "Shipped" means /health answers AND reports the commit this job
      # built. A 200 alone proved only that *a* revision was up: the audit
      # (8.3, 2026-09-21) found a live service 4+ days behind its source that
      # nobody could tell apart. A revision refused by the production guard
      # never goes ready, so the old one keeps answering -- with the old
      # commit, which fails here too.
      - name: Verify the live service answers /health with the deployed commit
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 20); do
            if BODY="$(curl -fsS --max-time 10 "$URL/health")"; then
              echo "$BODY"
              if printf '%s' "$BODY" | python3 deploy/gcp/check_served_commit.py "$GITHUB_SHA"; then
                echo "healthy and current after ${i} attempt(s): $URL"
                exit 0
              fi
            fi
            sleep 6
          done
          echo "::error::$URL/health never reported commit $GITHUB_SHA -- the deployed build is not the one serving"
          exit 1

  frontend:
    needs: [backend, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # firebase-tools does NOT reliably consume an ADC/WIF credentials file:
      # with `create_credentials_file: true` it commonly dies with "Failed to
      # authenticate, have you run firebase login?" even though gcloud in the
      # same job works (firebase/firebase-tools#10726 -- its autoAuth() wraps
      # the ADC exchange in a timeout and discards the real error). The
      # supported path is to mint a short-lived access token here and hand it
      # to the CLI via FIREBASE_TOKEN.
      - name: Authenticate to Google Cloud (access token for Firebase)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          token_format: access_token
          create_credentials_file: false

      # Pin Node: an unrelated Node regression (24.17.0 / 22.23.0) breaks the
      # STS token exchange with ERR_STREAM_PREMATURE_CLOSE, which firebase
      # reports as an auth failure. 22.x pinned below the bad patch.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the local gates run (HANDOVER.md section 3).
          # Unpinned, CI took the newest stable (3.47.5 on 2026-09-28), whose
          # analyzer raised a warning 3.44.9 does not, failed frontend-test
          # and skipped the Hosting deploy of e0d7d63. Bump it here and on
          # the development machines together, in one PR.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # The API base URL is baked into the Dart build, so this must run after
      # the backend URL is known -- otherwise the web app points at whatever
      # stale URL was compiled in last time.
      - name: Build Flutter web against the freshly deployed backend
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=ACADEMICOS_API="${{ needs.backend.outputs.url }}/api/v1"
        working-directory: frontend

      # Real fix 2026-09-17: pubspec.yaml declares assets/corpus/questions.json
      # (6.76 MB) unconditionally -- Flutter has no per-target conditional
      # asset mechanism, so `flutter build web` always copies it into the
      # output regardless of the ACADEMICOS_OFFLINE dart-define, even though
      # Web never reads it (it uses the live POST /questions/search route
      # instead; only the offline APK build's bundled CorpusRepository needs
      # this file locally). Stripping it post-build is the only way to keep
      # it out of what every Web visitor downloads without touching the
      # offline build, which runs `flutter build apk` as a wholly separate
      # step and is unaffected by this.
      - name: Strip the offline-only question bank from the web bundle
        run: |
          f="build/web/assets/assets/corpus/questions.json"
          if [ -f "$f" ]; then
            echo "Removing $(du -h "$f" | cut -f1) offline-only asset from the web bundle: $f"
            rm -f "$f"
          else
            echo "::warning::expected offline-only asset not found at $f -- pubspec.yaml or the build output path may have changed"
          fi
        working-directory: frontend

      # Flutter writes main.dart.js and flutter_bootstrap.js under the same
      # names every build; this renames both <name>.<content hash>.js and
      # points index.html (no-store) at them. firebase.json caches exactly that
      # name shape immutable, so a returning browser re-downloads the app only
      # after a deploy (D29). Fails the job if it cannot.
      - name: Give the entry files content-hashed names
        run: python3 scripts/web_cache_bust.py frontend/build/web

      # Pinned to v13: from 2026-09-24, firebase-tools@latest (v15) ignored
      # FIREBASE_TOKEN on the hand deploy and failed with "Failed to get
      # Firebase project"; v13 honours it (docs/deploy-by-hand.md).
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          npx --yes firebase-tools@13 deploy \
            --only hosting \
            --project "$PROJECT_ID" \
            --non-interactive
