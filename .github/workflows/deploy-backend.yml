name: Sync backend to deploy repo

# Render's academicos-backend service is image-backed (pulls
# docker.io/varshinicb99/academicos-backend:v1 directly), not connected to
# this repo -- pushing here alone never reached production. This closes that
# gap end to end, in three gated stages:
#   1. test          -- run the real pytest suite against src/academicos
#   2. sync          -- mirror backend-relevant files into
#                       varshinicb1/academicos-backend and push. That repo's
#                       own build-push.yml (triggered by THIS push, see its
#                       `on: push`) builds a fresh Docker image and redeploys
#                       Render automatically.
#   3. render-deploy -- poll Render's API until a deploy NEWER than the
#                       pre-sync snapshot goes live. Image-backed services
#                       carry no commit info, so "newest deploy is live" is
#                       the strongest check available; the snapshot prevents
#                       false-positives on the previous deploy while the new
#                       image is still building.
#
# Required secrets/variables for stage 2-3 verification (soft-optional: the
# pipeline still syncs and deploys without them, it just can't verify the
# rollout):
#   secret  RENDER_API_KEY      -- Render API key
#   variable RENDER_SERVICE_ID  -- Render service ID (srv-...)
on:
  push:
    branches: [master]
    paths:
      - 'pyproject.toml'
      - 'config/**'
      - 'src/academicos/**'
      # The suite IS the deploy gate, so a change to it must be able to
      # re-run the gate. A test-only fix for a red run triggered nothing:
      # master carried the fix and the last run anyone could see was the
      # failure it fixed (2026-09-23).
      - 'tests/**'
      - 'academicos-data/syllabus/**'
  workflow_dispatch: {}

jobs:
  test:
    # Real gate, not decoration: this repo has 924 real pytest cases for
    # src/academicos (confirmed passing, ~24s, 2026-08-26) that never ran
    # before a production sync/deploy until now -- a regression here used
    # to reach the live Render service with nothing catching it first.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AcademicOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # All extras, matching the environment the real 924-test result
      # (2026-08-26) was actually produced in -- dev+api alone would leave
      # ocr/retrieval/parse-vlm/mobile-scan/gcs-dependent tests either
      # erroring on a missing import or silently skipping, which would make
      # this gate report a smaller, less meaningful pass count than what
      # was actually verified. Correctness here matters more than install
      # time.
      - name: Install academicos with all extras
        run: pip install -e ".[dev,api,ocr,retrieval,parse-vlm,mobile-scan,gcs,mcp]"

      - name: Run the real test suite
        run: pytest tests/ -q

  sync:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.push.outputs.changed }}
      pre_deploy_id: ${{ steps.snapshot.outputs.pre_deploy_id }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout AcademicOS
        uses: actions/checkout@v4

      - name: Checkout academicos-backend
        uses: actions/checkout@v4
        with:
          repository: varshinicb1/academicos-backend
          token: ${{ secrets.SYNC_PAT }}
          path: backend-deploy

      # Snapshot Render's latest deploy BEFORE pushing, so render-deploy can
      # require a newer deploy ID (the image build downstream takes minutes;
      # without the snapshot "latest is live" would just describe the OLD
      # deploy).
      - name: Snapshot Render's latest deploy (pre-push)
        id: snapshot
        run: |
          python -m pip install --quiet requests
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "pre_deploy_id=" >> "$GITHUB_OUTPUT"
            echo "WARN: RENDER_API_KEY or RENDER_SERVICE_ID not set; the Render rollout will NOT be verified."
          else
            id="$(python scripts/render_deploy_status.py --service-id "$RENDER_SERVICE_ID" --print-latest-id)"
            echo "pre_deploy_id=$id" >> "$GITHUB_OUTPUT"
            echo "Pre-sync latest Render deploy: $id"
          fi

      - name: Sync backend-relevant files
        run: |
          cp pyproject.toml backend-deploy/pyproject.toml
          cp config/config.toml backend-deploy/config/config.toml
          rm -rf backend-deploy/src/academicos
          mkdir -p backend-deploy/src/academicos
          cp -r src/academicos/. backend-deploy/src/academicos/
          find backend-deploy/src/academicos -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          # Real, hand-verified CBSE syllabus data (syllabus/cbse_syllabus.py
          # resolves this at Path(__file__).parents[3]/academicos-data/syllabus,
          # i.e. repo-root-relative) -- without it the deployed backend seeds
          # zero subjects and /api/v1/syllabus/* 404s, exactly what the test
          # gate above now catches before ever reaching this step.
          mkdir -p backend-deploy/academicos-data/syllabus
          cp academicos-data/syllabus/*.json backend-deploy/academicos-data/syllabus/
          mkdir -p backend-deploy/academicos-data/users
          if [ -d academicos-data/users ]; then
            cp -r academicos-data/users/* backend-deploy/academicos-data/users/ 2>/dev/null || true
          fi

      - name: Commit and push if changed
        id: push
        working-directory: backend-deploy
        run: |
          git config user.name "academicos-sync-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No backend changes to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync from AcademicOS @ ${{ github.sha }}"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  render-deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout AcademicOS
        uses: actions/checkout@v4

      - name: Wait for the new Render deploy to go live
        run: |
          python -m pip install --quiet requests
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "WARN: RENDER_API_KEY or RENDER_SERVICE_ID not set; skipping Render rollout verification."
            exit 0
          fi
          pre="${{ needs.sync.outputs.pre_deploy_id }}"
          if [ -z "$pre" ]; then
            echo "WARN: no pre-push deploy snapshot available; skipping Render rollout verification."
            exit 0
          fi
          # Fails the workflow if the deploy newer than the snapshot goes
          # build_failed/update_failed/canceled, or never goes live.
          python scripts/render_deploy_status.py \
            --service-id "$RENDER_SERVICE_ID" \
            --after "$pre" \
            --wait 1800 --interval 30
