<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AcademicOS: question papers, lesson plans, timetables and progress for CBSE schools, from the NCERT books.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07080F" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AcademicOS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AcademicOS</title>
  <link rel="manifest" href="manifest.json">
  <!-- The app's typeface starts downloading with the app's code, not after
       it has started (they were 3.7 s behind it on Slow 4G, 2026-10-04). The
       engine's own fetch of the same files takes them from this download. -->
  <link rel="preload" href="assets/assets/fonts/Inter-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <style>
    /* The app takes a few seconds to load on a school's connection: until it
       draws, the brand and a word, not a blank page. flutter_bootstrap.js
       removes it. */
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; background: #FFFFFF; z-index: 1;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1D1D1F; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 8px 28px rgba(194, 65, 12, .18); }
    #splash .name { font-size: 22px; font-weight: 800; letter-spacing: -.2px; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #F1E4DC; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #C2410C; animation: acos-load 1.1s ease-in-out infinite; }
    @keyframes acos-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #07080F; color: #F5F5F7; }
      #splash .bar { background: #1E2236; }
      #splash .bar::after { background: #FF5A1F; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading AcademicOS">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">AcademicOS</div>
    <div class="bar"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
