name: academicos
description: CBSE Academic Brain - Academic planning, question bank, and analytics for CBSE/NCERT curriculum
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.5
  # riverpod_annotation: ^2.3.5  # Removed - using plain Riverpod
  
  # Routing
  go_router: ^14.2.0
  
  # Networking
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.3.1

  # DI
  get_it: ^7.7.0
  
  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path: ^1.9.0
  path_provider: ^2.1.3
  
  # Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Functional
  dartz: ^0.10.1
  either_dart: ^1.0.0
  
  # Date/Time
  # intl: ^0.19.0  # Pinned by flutter_localizations to 0.20.2
  timezone: ^0.9.3
  
  # Camera / OCR preprocessing
  camera: ^0.11.0
  image: ^4.2.0
  google_fonts: ^6.2.1

  # UI
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  expandable: ^5.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  file_picker: ^8.0.0+1
  
  # Platform
  window_manager: ^0.3.8
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  
  # Utils
  logger: ^2.4.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  # riverpod_generator: ^1.1.0  # Removed - using plain Riverpod
  drift_dev: ^2.18.0
  freezed: ^2.2.0
  json_serializable: ^6.8.0
  # hive_generator: ^1.1.0  # Removed - conflict with freezed
  
  # Testing
  # mocktail: ^0.2.0  # Removed - conflict with freezed
  # bloc_test: ^8.5.0  # Removed - conflict with freezed

flutter:
  uses-material-design: true
