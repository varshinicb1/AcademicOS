name: academicos
description: CBSE Academic Brain - Academic planning, question bank, and analytics for CBSE/NCERT curriculum
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Routing
  go_router: ^14.2.0
  
  # Networking
  dio: ^5.5.0+1
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1
  
  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path: ^1.9.0
  path_provider: ^2.1.3
  
  # Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Functional
  dartz: ^0.10.1
  either_dart: ^1.0.0
  
  # Date/Time
  intl: ^0.19.0
  timezone: ^0.9.3
  chrono: ^2.0.1
  
  # UI
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.1.35
  table_calendar: ^3.1.2
  expandable: ^5.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  file_picker: ^8.0.0+1
  
  # Platform
  window_manager: ^0.3.8
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  
  # Utils
  logger: ^2.4.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  
  # Testing
  mocktail: ^1.0.3
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/lottie/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500