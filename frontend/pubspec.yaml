name: academicos
description: CBSE Academic Brain - Academic planning, question bank, and analytics for CBSE/NCERT curriculum
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.5
  # riverpod_annotation: ^2.3.5  # Removed - using plain Riverpod
  
  # Routing
  go_router: ^14.2.0
  
  # Networking
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.3.1

  # DI
  get_it: ^7.7.0
  
  # Local Database
  # sqlite3_flutter_libs removed: confirmed zero imports anywhere in lib/
  # (matches the standing `_localDb` unused-field warnings in
  # repositories_impl.dart — that whole local-cache layer is dead code, the
  # app calls PillarApi directly). Its native FFI bindings don't compile for
  # web at all, which is what surfaced this — `flutter build web` failed
  # outright on sqlite3's `external` JS-interop-only members.
  drift: ^2.18.0
  path: ^1.9.0
  path_provider: ^2.1.3
  local_auth: ^2.3.0
  
  # Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Functional
  dartz: ^0.10.1
  either_dart: ^1.0.0
  
  # Date/Time
  # intl: ^0.19.0  # Pinned by flutter_localizations to 0.20.2
  timezone: ^0.9.3
  
  # Camera / OCR preprocessing
  # image_picker (not the raw `camera` plugin) drives the scan-capture flow:
  # it launches the platform's native camera app for a photo and hands back a
  # file, so there's no live-preview widget / permission-lifecycle code to get
  # subtly wrong on a device this session couldn't physically test on. The
  # `camera` package was an unused dependency (confirmed by grep — nothing in
  # lib/ imports it) and its camerax Android implementation doesn't compile
  # against this project's AndroidX/Gradle/JDK combination
  # (CallbackToFutureAdapter class-file-not-found on camera-core 1.5.3),
  # which broke `flutter build apk` outright. Removed rather than fixed since
  # nothing here needs it.
  image_picker: ^1.1.2
  # image: generates a real tiny PNG in local_scan_pdf_export_test.dart, and
  # is already a transitive dep of pdf; declared here so the direct import
  # resolves. A normal dependency, not a dev one -- declaring it in both is
  # what `unnecessary_dev_dependency` was warning about.
  image: ^4.2.0
  # google_fonts removed: Inter is bundled as an asset now (see the `fonts:`
  # block under `flutter:`), so nothing downloads a typeface at runtime and
  # this was the only thing that imported the package.
  # Real on-device handwriting/text OCR (Android only -- the offline build's
  # scan-and-grade path). Google's on-device text-recognition model, bundled
  # once and cached by Play Services on first use; no network call per scan.
  # Not Tesseract-via-Chaquopy: the real Python pipeline's only OCR engine
  # that's actually usable on a phone (its other engine, unlimited_ocr, needs
  # a GPU-backed service) is itself Tesseract-class -- ML Kit is the same
  # tier of engine, purpose-built for mobile, without bundling a Python
  # interpreter + native Tesseract binary + trained-data files into the APK.
  google_mlkit_text_recognition: ^0.15.0
  # Used directly by sarvam_vision_ocr.dart to unpack the doc-digitization
  # job's result ZIP -- was only a transitive dependency before, declaring
  # it explicitly since this file imports it directly.
  archive: ^3.6.1
  # Used directly by corpus_downloader.dart for SHA-256 checksum
  # verification -- same reasoning, was only transitive before.
  crypto: ^3.0.3

  # UI
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  expandable: ^5.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  # share_plus was another unused dependency (confirmed by grep — no
  # `package:share_plus` import or `Share.` call anywhere in lib/) and its
  # old pin conflicted with the file_picker bump below over the `web`
  # package version, so it's removed rather than carried forward unused.
  # 8.0.x's Android module hardcodes compileSdk 34, which fails to build
  # against flutter_plugin_android_lifecycle's compileSdk-36 requirement on
  # a current Flutter SDK; 10.3.10+ derives it from flutter.compileSdkVersion
  # instead, confirmed by reading both versions' android/build.gradle directly.
  # 11.0.2 fixes that but still fails to compile on this project's AGP 9.0.1 —
  # its Groovy build.gradle skips applying the Kotlin Android plugin under
  # AGP 9 (expecting Flutter's Built-in Kotlin to pick up the slack) but the
  # plugin's Kotlin sources never actually get compiled, so
  # GeneratedPluginRegistrant can't find FilePickerPlugin. The 12.0.0 beta
  # ships a build.gradle.kts, which is what a plugin fully migrated to
  # Built-in Kotlin looks like — confirmed by reading its Gradle file.
  file_picker: ^12.0.0-beta.7

  # Question-paper UX: preview the generated PDF in-app, print it, or share it
  # without leaving the review screen — the step a teacher actually does next.
  printing: ^5.13.1
  pdf: ^3.11.1
  # Professional, accessible theming instead of hand-rolled ColorSchemes.
  flex_color_scheme: ^8.4.0
  # Declarative entrance/state animations for dashboards.
  flutter_animate: ^4.5.0
  # Readable spacing without SizedBox noise.
  gap: ^3.0.1
  
  # Platform
  window_manager: ^0.3.8
  # Bumped for win32 ^6.3.0 compatibility with the file_picker beta below
  # (its own `PackageInfo.fromPlatform()` usage is unaffected — same API
  # across these versions).
  package_info_plus: ^10.2.1
  # device_info_plus removed: unused (confirmed by grep — no
  # `package:device_info_plus` import anywhere in lib/) and its win32 <6.0.0
  # constraint conflicted with the file_picker beta bump above.
  # connectivity_plus removed: unused (confirmed by grep — no
  # `package:connectivity_plus` import anywhere in lib/) and 6.0.3's Android
  # module applies org.jetbrains.kotlin.android unconditionally, with no
  # AGP-9 guard — it predates that fix and fails outright with
  # android.builtInKotlin=true.

  # Utils
  logger: ^2.4.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test:
  #   sdk: flutter
  # Disabled 2026-08-26: this Flutter SDK (3.44.9) has a real gradle-tooling
  # bug where GeneratedPluginRegistrant.java unconditionally emits a
  # registration call for every plugin, but PluginHandler.kt correctly
  # excludes dev_dependency plugins from the release build's Gradle
  # classpath -- so `flutter build apk --release` fails with "package
  # dev.flutter.plugins.integration_test does not exist" the moment the
  # generated file is regenerated fresh (a stale cached copy from before
  # this dependency was added had been masking it). Re-enable once either
  # the SDK ships a fix or a device is available to actually run
  # integration_test/teacher_flow_test.dart again -- that file is left in
  # place, just not compilable until this is restored (see
  # analysis_options.yaml's matching exclude).
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  # riverpod_generator: ^1.1.0  # Removed - using plain Riverpod
  drift_dev: ^2.18.0
  freezed: ^2.2.0
  json_serializable: ^6.8.0
  # hive_generator: ^1.1.0  # Removed - conflict with freezed
  
  # Testing
  # mocktail: ^0.2.0  # Removed - conflict with freezed
  # bloc_test: ^8.5.0  # Removed - conflict with freezed

  # Imported directly by the offline-engine tests, which install a
  # FakePathProvider so a widget test writes into a temp dir instead of the
  # machine's documents folder. Both arrive transitively via path_provider,
  # but `depend_on_referenced_packages` counts a direct import that is not a
  # declared dependency -- ten of the info lints the 2026-09-23 re-audit
  # listed -- and a transitive version is not a version this repo pinned.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/corpus/questions.json
    - assets/images/demo_scan_page_1.jpg
    - assets/images/demo_scan_page_2.jpg

  # Inter, vendored, instead of google_fonts downloading it at runtime.
  #
  # google_fonts did work -- a release web build fetches three TTFs from
  # fonts.gstatic.com/s/a/ on first paint (verified 2026-09-23 via
  # performance.getEntriesByType('resource'); document.fonts stays empty
  # because CanvasKit registers typefaces with Skia, not as CSS FontFaces).
  # It is still the wrong mechanism for this app:
  #   * every cold load paints in the browser's fallback sans until three
  #     ~300 KB files land from a third party, so the first frame a teacher
  #     sees is not the design system's;
  #   * the packaged Windows build runs a bundled backend and is meant to
  #     work offline -- there its typeface simply never arrives;
  #   * google_fonts registers each weight as its own one-face family
  #     (`Inter_regular`, `Inter_500`, `Inter_600`) via FontLoader, and the
  #     style it returns names that family. So a widget that takes a theme
  #     style and `copyWith(fontWeight: FontWeight.bold)` -- which lib/ does
  #     in 62 places, against a family that only ever held one face -- has no
  #     real 700 face to resolve to and gets a synthesised one. A single
  #     `Inter` family with four declared weights, below, resolves properly.
  #
  # These are the exact files google_fonts resolves Inter to, downloaded from
  # the same URLs and checked against its own expected SHA-256 and byte
  # length, so rendering is unchanged from what the site shipped. Inter 3.019
  # by the Inter Project Authors; SIL OFL 1.1, kept beside them in OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
