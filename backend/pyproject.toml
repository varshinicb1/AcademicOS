[project]
name = "academicos"
version = "1.0.0"
description = "CBSE Academic Brain - Document ingestion, knowledge graph, and learning algorithms"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AcademicOS Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    
    # Database
    "aiosqlite>=0.19",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    
    # Vector DB
    "qdrant-client>=1.9",
    
    # Object Storage
    "minio>=7.2",
    "boto3>=1.34",
    
    # PDF Processing
    "pdfplumber>=0.11",
    "pymupdf>=1.23",
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "pytesseract>=0.3",
    "pdfminer.six>=20231228",
    "camelot-py[cv2]>=0.1",
    "layoutparser>=0.3",
    
    # Image Processing
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "numpy>=1.26",
    
    # NLP/ML
    "transformers>=4.38",
    "torch>=2.2",
    "sentence-transformers>=2.5",
    "spacy>=3.7",
    
    # API
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    
    # Async/Concurrency
    "aiomultiprocess>=0.9",
    "tenacity>=8.2",
    
    # Monitoring
    "loguru>=0.7",
    "tqdm>=4.66",
    "prometheus-client>=0.19",
    
    # Utils
    "orjson>=3.9",
    "xxhash>=3.4",
    "python-magic>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
gpu = [
    "paddlepaddle-gpu>=2.6",
    "torch[cuda]>=2.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["academicos*"]
exclude = ["tests*", "ingestion*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PTH"]
ignore = ["S101", "ARG001", "ARG002"]
per-file-ignores = { "tests/*" = ["S101", "SLF001"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["academicos"]
omit = ["tests/*", "*/migrations/*"]